<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Кирюха-бензопила и Свино-сан</title>
  <style>

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }




@font-face {
  font-family: 'Segoe UI';
  src: url('fonts/segoeuib.ttf') format('ttf');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}




      html, body {
      margin: 0;
      padding: 0; 
      width: 100%;
      height: 100%;     
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Верхняя панель */
    #hud {
      position: absolute;
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #2f3640;
      border-bottom: 3px solid #e84118;
      font-size: 18px;
      font-weight: bold;
      z-index: 10;
    }

    .hud-group {
      display: flex;
      gap: 20px;
      align-items: center;
    }

   

  

    /* Игровое поле */
    #game-container {
     position: relative;
    
      width: 100%;
      height: 100%;
      background: #667C26;
      overflow: hidden;
      
    }


.bg-svg {
    position: absolute;
    left: 50%;
    transform: translateX(-50%); /* Центрирование по горизонтали */
    height: 100%; /* 100% высоты экрана */
    width: auto;  /* Ширина подстраивается пропорционально */
    z-index: 1;
    pointer-events: none; /* Чтобы картинка не перехватывала клики */
}


#img-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    /* Опционально: центрируем кнопку старта по центру экрана */
    display: flex;
    justify-content: center;
   background: #667C26;
} 


#img-container img{
top: 45px;    
} 



#restartBtn {
            position: absolute;
            bottom: 15px;
            padding: 1%;
            font-size: 20px;
            background: #CC3300;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            width: 20%;
            min-width: 300px;
           
            
            z-index: 6;
box-shadow: 0px 6px 4px #000;
        }

#restartBtn:hover {
  transform: translateY(-3px);
 
}
#restartBtn:active {
  transform: translateY(3px);
 
}


.scalex {
transform: scaleX(-1);
}



#gameCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    background: transparent;
}

  

    textarea {
      width: 100%;
      height: 140px;
      background: #1e272e;
      color: #4cd137;
      border: 1px solid #718093;
      border-radius: 6px;
      padding: 10px;
      font-size: 12px;
      resize: vertical;
    }

    select {
      padding: 8px;
      border-radius: 6px;
      background: #1e272e;
      color: #fff;
      border: 1px solid #718093;
    }

    
    /* Подсказка управления */
    #controls-hint {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 3;
      font-size: 16px;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      pointer-events: none;
      white-space: nowrap;
 }


@media (pointer: coarse) {
  #controls-hint {
    display: none !important;
  }
}


@media screen and (max-width: 370px) {
  .hud-group {
    gap: 15px;
  }
#hud {
font-size: 17px;
}
}




</style>
</head>

 <span>Время: <span id="time">180</span> сек</div>
    </div>
  
  </div>

<img src="img/img.jpg" class="bg-svg">


        <button id="restartBtn" " style="display: block;">ЗАПИЛИТЬ СВИНО-САНЮ</button>
    </div>
    
</div>

  function loadSVGToImage(svgCode, targetKey) {
    let cleanCode = svgCode.trim();
    if (!cleanCode.includes('xmlns=')) {
      cleanCode = cleanCode.replace('<svg', '<svg xmlns="http://w3.org"');
    }
    const blob = new Blob([cleanCode], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);

      sprites[targetKey] = img;
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      
    };
    img.src = url;
  }

 // --- ИГРОВОЙ ЦИКЛ ---
  let spawnTimer = 0;





function update() {






// Адаптивный размер игрока под экран 
player.size = (Math.min(550, Math.min(width, height) * 0.7))*scaler;
pila.size = (Math.min(550, Math.min(width, height) * 0.7))*scaler;
arr.size = (Math.min(550, Math.min(width, height) * 0.7))*scaler;
arl.size = (Math.min(550, Math.min(width, height) * 0.7))*scaler;



    // Движение игрока (клавиатура)
let dx = 0, dy = 0;
if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
// Движение к пальцу/курсору
if (pointerTarget) {
const distX = pointerTarget.x - player.x;
const distY = pointerTarget.y - player.y;
const dist = Math.hypot(distX, distY);
if (dist > 10) {
dx = distX / dist;
dy = distY / dist;
}
} else if (dx !== 0 || dy !== 0) {
const len = Math.hypot(dx, dy);
dx /= len;
dy /= len;
}
if (dx !== 0 || dy !== 0) {
player.x += dx * player.speed;
player.y += dy * player.speed;
player.walkCycle += 0.25;
pila.x += dx * player.speed;
pila.y += dy * player.speed;
pila.walkCycle += 0.25;
arr.x += dx * player.speed;
arr.y += dy * player.speed;
arr.walkCycle += 0.25;
arl.x += dx * player.speed;
arl.y += dy * player.speed;
arl.walkCycle += 0.25;
if (dx > 0.1) player.facingRight = true;
if (dx > 0.1) pila.facingRight = true;
if (dx > 0.1) arr.facingRight = true;
if (dx > 0.1) arl.facingRight = true;
if (dx < -0.1) player.facingRight = false;
if (dx < -0.1) pila.facingRight = false;
if (dx < -0.1) arr.facingRight = false;
if (dx < -0.1) arl.facingRight = false;
} else {
player.walkCycle = 0;
pila.walkCycle = 0;
arr.walkCycle = 0;
arl.walkCycle = 0;


}

// Ограничение в пределах экрана
//const half = player.size / 2;
const half = 0;
player.x = Math.max(half, Math.min(width - half, player.x));
player.y = Math.max(half, Math.min(height - half, player.y));
pila.x = Math.max(half, Math.min(width - half, pila.x));
pila.y = Math.max(half, Math.min(height - half, pila.y));
arr.x = Math.max(half, Math.min(width - half, arr.x));
arl.y = Math.max(half, Math.min(height - half, arl.y));




// Анимация взмаха бензопилой


if (player.swingTimer > 0) {
player.swingTimer--;

// Резкий взмах вперед-вниз
player.swingAngle = Math.sin((15 - player.swingTimer) / 15 * Math.PI) * 1.1;
pila.swingAngle = Math.sin((15 - player.swingTimer) / 15 * Math.PI) * 1.1;
arr.swingAngle = Math.sin((15 - player.swingTimer) / 15 * Math.PI) * 1.1;
arl.swingAngle = Math.sin((15 - player.swingTimer) / 15 * Math.PI) * 1.1;
} else {
player.swingAngle = 0;
pila.swingAngle = 0;
arr.swingAngle = 0;
arl.swingAngle = 0;
}


// Спавн свиней
spawnTimer--;
if (spawnTimer <= 0 && moles.length < 6) {
spawnMole();
spawnTimer = Math.max(35, 90 - score * 1.5); // Чем больше счёт, тем быстрее лезут
}
  



// Координата лезвия бензопилы
const reach = player.size * 0.5;

const bladeWidth = player.size / 4;
const bladeRadius = bladeWidth / 2;

//alert (offset);

const bladeX = player.facingRight 
  ? player.x + offset
  : player.x - offset;

const bladeY = player.y - (player.size / 6) + Math.sin(player.swingAngle) * (20*scaler);




// Обновление свиней и проверка удара
for (let i = moles.length - 1; i >= 0; i--) {
const m = moles[i];

if (dist < hitRadius) {
 //console.log("Убит свин:", m, "Дистанция:", dist, "Радиус:", hitRadius);
// Убийство свина!

hitSound.currentTime = 0; // Сбрасываем на начало, если звук еще играет от прошлого удара

createSplatter(m.x, m.y);
moles.splice(i, 1);
score++;
shakeTime = 8;
document.getElementById('score').textContent = score;
if (score > highScore) {
highScore = score;
localStorage.setItem('moleChainsawHigh', highScore);
document.getElementById('highscore').textContent = highScore;
}
continue;
}
if (m.life <= 0) {
moles.splice(i, 1);
}
}






// Обновление частиц
for (let i = particles.length - 1; i >= 0; i--) {
const p = particles[i];
// Движение
    
    p.x += p.vx;
    p.y += p.vy;

    // Замедление и уменьшение растяжения при остановке
    //p.vx *= 0.92;
    //p.vy *= 0.92;
    p.stretch = Math.random() * 6;
p.radius -= 0.9;
if (p.radius <= 0) particles.splice(i, 1);
}
if (shakeTime > 0) shakeTime--;
}





function draw() {



ctx.save();
ctx.clearRect(0, 0, width, height);



// Отрисовка свиней
const time = performance.now() / 750; // Чем больше делитель, тем медленнее покачивание

moles.forEach((m, index) => {
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.translate(m.x, m.y);
    
    // Вычисляем угол наклона (0.15 радиан ≈ 8.5 градусов)
    // "+ index" нужен, чтобы свиньи качались вразнобой, а не синхронно
    const wobbleAngle = Math.sin(time + index) * 0.1;

    ctx.rotate(wobbleAngle);

    if (m.flipX) {
        ctx.scale(-1, 1);
    }
    ctx.scale(m.scale, m.scale);
    ctx.drawImage(sprites.mole, -m.size / 2, -m.size / 2, m.size, m.size);
    ctx.restore();

});





// Отрисовка частиц


particles.forEach(p => {
ctx.save();
ctx.globalAlpha = p.alpha;
ctx.fillStyle = p.color;
// Переносим центр в координату частицы, поворачиваем и растягиваем
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.scale(p.stretch, 1 / Math.sqrt(p.stretch)); // вытягиваем вперед, сжимаем по бокам

    // Рисуем искаженную форму вместо ctx.arc()
    ctx.beginPath();
    const step = (Math.PI * 2) / p.points.length;
    for (let j = 0; j < p.points.length; j++) {
      const currAngle = j * step;
      // Добавляем динамическую пульсацию краев
      const distortion = Math.sin(p.wobblePhase + j) * 0.15;
      const r = p.radius * (p.points[j] + distortion);
      
      const px = Math.cos(currAngle) * r;
      const py = Math.sin(currAngle) * r;

      if (j === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
ctx.closePath();
    ctx.fill();
    ctx.restore();
});
ctx.globalAlpha = 1;


// Отрисовка игрока
ctx.save();
ctx.imageSmoothingEnabled = false;
const bobbing = Math.sin(player.walkCycle) * 4; // Покачивание при беге
ctx.translate(player.x, player.y + bobbing);
if (!player.facingRight) ctx.scale(-1, 1);
ctx.rotate(player.swingAngle * 0.4);
ctx.drawImage(sprites.player, -player.size/2, -player.size/2, player.size, player.size);
ctx.restore();




// Отрисовка анимированных зубьев
const vibX = ((Math.random() - 0.5) * 3)*scaler;
const vibY = ((Math.random() - 0.5) * 3)*scaler;

ctx.save();
ctx.translate(player.x, player.y + vibX + vibY);


  if (!player.facingRight) ctx.scale(-1, 1);
  ctx.rotate(pila.swingAngle * 0.4);

  if (player.swingTimer > 0) {
    ctx.rotate(Math.sin(((15 - player.swingTimer) / 15) * Math.PI) * 0.005);
  }

  const scale = (Math.min(550, Math.min(width, height) * 0.7) / 125)*scaler;
  ctx.scale(scale, scale);

  const svgSize = 125;
  ctx.translate(-svgSize / 2, -svgSize / 2);



  ctx.strokeStyle = "#CCCCCC";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  // Настраиваем пунктир: [длина штриха, длина пробела] (сумма = 2 + 4 = 6)
  ctx.setLineDash([0.5, 4.5]);
  // Сдвигаем фазу пунктира
  ctx.lineDashOffset = +dashOffset;
  ctx.stroke(contourPath);

  // Возвращаем исходные настройки контекста
  ctx.restore();

  // Увеличиваем смещение для следующего кадра (скорость анимации)
  dashOffset -= 0.5;

  // Сбрасываем счетчик кратно сумме штриха и пробела (2 + 4 = 6)
  if (dashOffset >= 5) {
    dashOffset = 0;
}














// Вибрация бензопилы (работающий мотор)
ctx.save();
ctx.imageSmoothingEnabled = false;
ctx.translate(pila.x, pila.y + vibX + vibY);
if (!pila.facingRight) ctx.scale(-1, 1);
ctx.rotate(pila.swingAngle * 0.4);
ctx.drawImage(sprites.pila, -pila.size/2, -pila.size/2, pila.size, pila.size);
ctx.restore();


// Копирайт
ctx.save();
ctx.imageSmoothingEnabled = false;
ctx.translate(pila.x, pila.y + vibX + vibY);
if (!player.facingRight) ctx.scale(-1, 1);
ctx.rotate(arr.swingAngle * 0.4);
if (pila.facingRight){
ctx.drawImage(sprites.arr, -arr.size/2, -arr.size/2, arr.size, arr.size);
}
if (!pila.facingRight){
ctx.drawImage(sprites.arl, -arl.size/2, -arl.size/2, arl.size, arl.size);
}
ctx.restore();







}



function gameLoop() {
update();
draw();
requestAnimationFrame(gameLoop);


}



// Запуск / перезапуск игры


function endGame() {

    isGameOver = true;
    clearInterval(timerInterval);
    clearTimeout(spawnTimeout);
    restartBtn.style.display = 'block';
    imgcontainer.style.display = 'flex';
}

function startGame() {

    score = 0;
    timeLeft = 180;
    isGameOver = false;
    particles = [];
    scoreEl.innerText = score;
    timeEl.innerText = timeLeft;
    restartBtn.style.display = 'none';
    imgcontainer.style.display = 'none';
    
    
  




    timerInterval = setInterval(() => {
        timeLeft--;
        timeEl.innerText = timeLeft;
        if (timeLeft <= 0) {
         endGame()

     }
    }, 1000);

    spawnMole();

}






    gameLoop();




// Старт

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
scaler = Math.min(Math.max(window.innerWidth / BASE_WIDTH, 0.7), 5);

});

restartBtn.addEventListener('click', () => {
ctx.clearRect(0, 0, canvas.width, canvas.height);
startGame();

});














</script>
